<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HybridgeFlix</title>
</head>
<body>

  <h1>Mi aplicacion HybridgeFlix</h1>
  <p>Bienvenido a mi catalogo de peliculas</p>

  <form id="formularioPelicula">
    <label for="titulo">Título:</label>
    <input type="text" id="titulo" required>

    <label for="anio">Año:</label>
    <input type="number" id="anio" required>

    <label for="calificacion">Calificación:</label>
    <input type="number" id="calificacion" min="1" max="10" required>

    <label for="resena">Reseña:</label>
    <textarea id="resena"></textarea>

    <button type="submit">Guardar</button>
</form>
  <h2>Películas registradas</h2>

<table>
    <thead>
        <tr>
            <th>Título</th>
            <th>Año</th>
            <th>Calificación</th>
            <th>Reseña</th>
        </tr>
    </thead>
    <tbody id="cuerpoTabla">
    </tbody>
</table>
    <script>
      const formulario = document.getElementById("formularioPelicula");
      const cuerpoTabla = document.getElementById("cuerpoTabla");
      formulario.addEventListener("Submit", function(event) {
        event.preventDefault();
        const titulo = document.getElementById("titulo").value;
        const anio = document.getElementById("anio").value;
        const calificacion = document.getElementById("calificacion").value;
        const resena = document.getElementById("resena").value;
        const fila = document.createElemet("tr");
        fila.innerHTML = `
           <td>${titulo}</td>
           <td>${anio}</td>
           <td>${calificacion}</td>
           <td>${resena}</td>
        `;
        cuerpoTabla.appendChild(fila);
        formulario.reset();
      });  

    </script>
</body>
</html>
